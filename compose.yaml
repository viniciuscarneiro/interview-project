name: interview-project
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview_local_only
      POSTGRES_DB: interview_dev
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interview -d interview_dev']
      interval: 2s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview_local_only
      POSTGRES_DB: interview_test
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interview -d interview_test']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
